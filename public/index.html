    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #050010;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 25%, #1a0a40 0%, #050010 65%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.8s;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
      z-index: 1;
    }

    #menu {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      padding: max(48px, env(safe-area-inset-top) + 28px) 14px 30px;
      gap: 9px;
      z-index: 10;
      overflow-y: auto;
    }

    #menu.hidden {
      display: none;
    }

    .menuTitle {
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b81, #a55eea 50%, #1e90ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      line-height: 0.95;
      letter-spacing: -2px;
      filter: drop-shadow(0 4px 30px rgba(165, 94, 234, 0.6));
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {

      0%,
      100% {
        filter: drop-shadow(0 4px 30px rgba(165, 94, 234, 0.6))
      }

      50% {
        filter: drop-shadow(0 4px 42px rgba(30, 144, 255, 0.9))
      }
    }

    .menuSub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: -4px;
      margin-bottom: 2px;
    }

    .menuBtn {
      width: 100%;
      max-width: 340px;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      -webkit-appearance: none;
      font-family: inherit;
    }

    .menuBtn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.1);
    }

    .menuBtn .icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .menuBtn .text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      min-width: 0;
    }

    .menuBtn .text small {
      font-weight: 400;
      font-size: 10px;
      opacity: 0.6;
    }

    .menuBtn .badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      font-size: 11px;
      font-weight: 800;
      color: #ffdd59;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;

    }

    .soundToggles {
      display: flex;

      margin-top: 5px;
    }

    .soundToggle {

      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);

#topBar {
display: grid;
grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);

padding: 8px 4px 6px;

.pill {
padding: 6px 10px;
border-radius: 999px;
background: rgba(255, 255, 255, 0.06);
border: 1px solid rgba(255, 255, 255, 0.12);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
display: flex;
align-items: center;
gap: 6px;
font-weight: 700;
font-size: 13px;
min-width: 0;
max-width: 100%;
overflow: hidden;
}

.pillText {
flex: 1;
min-width: 0;
overflow: hidden;
white-space: nowrap;
text-overflow: ellipsis;
}

.pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
#mePill .dot { background: #1e90ff; box-shadow: 0 0 10px #1e90ff; }
#oppPill .dot { background: #ff4757; box-shadow: 0 0 10px #ff4757; }

#mePill { justify-self: start; }
#oppPill { justify-self: end; }

.pill.hidden { visibility: hidden; pointer-events: none; }

.pill span { font-variant-numeric: tabular-nums; }
.pill .name { font-weight: 800; }

/* На очень узких экранах прячем emoji-аватарку соперника */
@media (max-width: 380px) {
.pill { font-size: 12px; padding: 5px 8px; }
#oppAvatarDisplay { display: none; }
}
    
    #mePill { justify-self: start; }
    #oppPill { justify-self: end; }
    
    /* Когда соперника нет — левая пилюля тянется на всю ширину */
    #oppPill.hidden ~ *,
    #topBar > .pill:only-of-type { justify-self: stretch; }

    .pill.hidden {
      opacity: 0;

    #oppPill .dot {

    }

    .pill span {
      font-variant-numeric: tabular-nums;
    }

    .pill .name {
      font-weight: 800;
    }

    /* АНИМИРОВАННЫЕ ОБОИ */
    body.animated-bg::before {
      animation: bgScale 18s ease-in-out infinite;
    }

    @keyframes bgScale {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    body.animated-bg::after {
      content: '';
      position: fixed;
      inset: -10%;
      background:
        radial-gradient(circle at 15% 25%, var(--blob1, transparent), transparent 42%),
        radial-gradient(circle at 85% 70%, var(--blob2, transparent), transparent 45%),
        radial-gradient(circle at 45% 88%, var(--blob3, transparent), transparent 42%),
        radial-gradient(circle at 75% 12%, var(--blob4, transparent), transparent 40%);
      animation: blobsMove 36s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    @keyframes blobsMove {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(3%, -2%) scale(1.06);
      }

      50% {
        transform: translate(-2%, 4%) scale(0.96);
      }

      75% {
        transform: translate(2%, 2%) scale(1.03);
      }
    }

    #bgParticles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%);
      animation: floatUp linear infinite;
      opacity: 0;
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      85% {
        opacity: 0.5;
      }

      100% {
        transform: translateY(-115vh) scale(0.5);
        opacity: 0;
      }
    }

            /* СЛОЖНЫЕ АНИМАЦИИ — ЧЕМПИОНСКИЕ */
            .avatarCircle.anim-dragon {
            position: relative; overflow: visible;
            animation: dragonBreathe 2.4s ease-in-out infinite;
            }
            .avatarCircle.anim-dragon::after {
            content: '\1F525';
            position: absolute; font-size: 14px; right: -8px; bottom: -2px;
            animation: dragonFire 1.6s ease-out infinite;
            pointer-events: none;
            }
            @keyframes dragonBreathe {
            0%,100% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 8px #ff4500); }
            50% { transform: scale(1.18) rotate(3deg); filter: drop-shadow(0 0 18px #ff8b1a); }
            }
            @keyframes dragonFire {
            0% { transform: translate(0,0) scale(0.4); opacity: 1; }
            60% { transform: translate(10px,-6px) scale(1.2); opacity: 0.9; }
            100% { transform: translate(20px,-14px) scale(0.2); opacity: 0; }
            }
            
            .avatarCircle.anim-lion {
            position: relative; overflow: visible;
            animation: lionRoar 2s ease-in-out infinite;
            }
            .avatarCircle.anim-lion::before {
            content: '';
            position: absolute; inset: -6px; border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.9);
            animation: lionRing 2s ease-out infinite;
            pointer-events: none;
            }
            @keyframes lionRoar {
            0%,100% { transform: scale(1); filter: drop-shadow(0 0 10px #ff8b1a) brightness(1); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 22px #ffd93b) brightness(1.3); }
            }
            @keyframes lionRing {
            0% { transform: scale(0.7); opacity: 1; border-color: rgba(255,215,0,1); }
            100% { transform: scale(1.6); opacity: 0; border-color: rgba(255,80,0,0); }
            }
            
            .avatarCircle.anim-phoenix {
            position: relative; overflow: visible;
            animation: phoenixFly 2s ease-in-out infinite;

    tone: function(f, d, t, v) {
      if (!this.enabled || !this.ctx) return;
      try {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = t || 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(v || 0.1, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + d);
      } catch (e) {}
    },
    place: function() { this.tone(600, 0.07, 'triangle', 0.12); },
    clear: function(n) {
      if (n <= 1) this.tone(880, 0.15, 'sine', 0.18);

  function emptyBoard() { return Array.from({length: BOARD_SIZE}, function() { return Array(BOARD_SIZE).fill(null); }); }
  function updateBoardRect() {
    const r = boardCanvas.getBoundingClientRect();
    state.boardX = r.left; state.boardY = r.top;
  }
  function resizeBoard() {
    const w = $('boardWrap').clientWidth, h = $('boardWrap').clientHeight;
    const size = Math.max(80, Math.min(w, h) - 8);
    const cell = Math.floor(size / BOARD_SIZE);
    state.cellSize = cell; state.boardPixelSize = cell * BOARD_SIZE;
    const dpr = window.devicePixelRatio || 1;
    boardCanvas.width = state.boardPixelSize * dpr;
    boardCanvas.height = state.boardPixelSize * dpr;
    boardCanvas.style.width = state.boardPixelSize + 'px';
    boardCanvas.style.height = state.boardPixelSize + 'px';
    boardCanvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    requestAnimationFrame(updateBoardRect);
    needsRedraw = true;
  }
  function isNearlyFull(y, x) {
    let f = 0, fc = 0;
    for (let i = 0; i < BOARD_SIZE; i++) if (state.board[y][i]) f++;
    for (let i = 0; i < BOARD_SIZE; i++) if (state.board[i][x]) fc++;
    return f === BOARD_SIZE-1 || fc === BOARD_SIZE-1;
  }
  function drawBoard() {
    if (!state.cellSize) return;
    const ctx = boardCanvas.getContext('2d');
    const cell = state.cellSize, total = state.boardPixelSize;
    const now = performance.now();
    ctx.clearRect(0, 0, total, total);
    const shX = state.screenShake > 0 ? (Math.random()-0.5)*state.screenShake*8 : 0;
    const shY = state.screenShake > 0 ? (Math.random()-0.5)*state.screenShake*8 : 0;
    ctx.save(); ctx.translate(shX, shY);
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    roundRect(ctx, 0, 0, total, total, 14); ctx.fill();

    const flashMap = new Map();
    for (const fc of state.flashCells) flashMap.set(fc.y*BOARD_SIZE + fc.x, fc);

    for (let y = 0; y < BOARD_SIZE; y++) {
      for (let x = 0; x < BOARD_SIZE; x++) {
        const px = x*cell, py = y*cell, pad = 2, inner = cell - pad*2;
        const data = state.board[y][x];
        const flash = flashMap.get(y*BOARD_SIZE + x);
        if (data) {
          const el = now - data.placedAt;
          let scale = 1;
          if (el < PLACE_ANIM_MS) {
            const t = el / PLACE_ANIM_MS;
            scale = 0.45 + 0.55*(1-Math.pow(1-t,3)) + 0.12*Math.sin(t*Math.PI);
          }
          const fl = flash ? Math.max(0, 1-(now-flash.t0)/FLASH_MS) : 0;
          renderBlock(ctx, px+pad, py+pad, inner, data.color, scale, fl);
        } else {
          if (isNearlyFull(y, x)) {
            const pulse = 0.5 + 0.5*Math.sin(now/400 + x + y);
            ctx.fillStyle = 'rgba(255,221,89,'+(0.08+pulse*0.12)+')';
          } else ctx.fillStyle = 'rgba(255,255,255,0.05)';
          roundRect(ctx, px+pad, py+pad, inner, inner, Math.max(3, inner*0.18));
          ctx.fill();
        }
      }
    }
    if (dragging && dragging.hover) {
      const cc = dragging.hover.cells;
      const valid = dragging.hover.valid;
      for (const g of cc) {
        const gx = g[0], gy = g[1];
        if (gx < 0 || gx >= BOARD_SIZE || gy < 0 || gy >= BOARD_SIZE) continue;
        const px = gx*cell, py = gy*cell, pad = 2, inner = cell - pad*2;
        ctx.fillStyle = valid ? hexA(dragging.piece.color, 0.55) : 'rgba(255,70,70,0.42)';
        roundRect(ctx, px+pad, py+pad, inner, inner, Math.max(3, inner*0.18)); ctx.fill();
        if (valid) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.stroke(); }
      }
    }
    ctx.restore();
    if (particles.length) {
      for (const p of particles) {
        const a = Math.max(0, p.life/p.maxLife);
        ctx.globalAlpha = a; ctx.fillStyle = p.color;
        if (p.streak) {
          ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size*a, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function loadPiecesFromSequence() {
    const t = state.sequence[state.seqIndex];
    if (!t) { state.pieces = [null,null,null]; return; }
    state.pieces = t.map(function(p) { return { shape: SHAPES[p.s] || SHAPES[0], color: p.c }; });
  }
  function renderTray() {
    document.querySelectorAll('.pieceSlot').forEach(function(slot, i) {
      slot.innerHTML = ''; slot.classList.remove('used');
      const piece = state.pieces[i];
      if (!piece) { slot.classList.add('used'); return; }
      const sw = slot.clientWidth || 100, sh = slot.clientHeight || 90;
      let mx = 0, my = 0;
      for (const c of piece.shape) { if (c[0]>mx) mx=c[0]; if (c[1]>my) my=c[1]; }
      const pw = mx+1, ph = my+1;
      const cell = Math.max(6, Math.min((sw-12)/pw, (sh-12)/ph, 30));
      const w = pw*cell, h = ph*cell;
      const dpr = window.devicePixelRatio || 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(w*dpr); canvas.height = Math.ceil(h*dpr);
      canvas.style.width = w+'px'; canvas.style.height = h+'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (const c of piece.shape) renderBlock(ctx, c[0]*cell+1, c[1]*cell+1, cell-2, piece.color);
      slot.appendChild(canvas);
    });
  }

  function startDrag(idx, cx, cy) {
    const piece = state.pieces[idx];
    if (!piece || state.gameState !== 'playing' || dragging) return;
    updateBoardRect();
    const cell = state.cellSize;
    let mx = 0, my = 0;
    for (const c of piece.shape) { if (c[0]>mx) mx=c[0]; if (c[1]>my) my=c[1]; }
    const w = (mx+1)*cell, h = (my+1)*cell;
    const dpr = window.devicePixelRatio || 1;
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(w*dpr); canvas.height = Math.ceil(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    canvas.style.position = 'absolute'; canvas.style.left = '0'; canvas.style.top = '0';
    canvas.style.willChange = 'transform';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const c of piece.shape) renderBlock(ctx, c[0]*cell+2, c[1]*cell+2, cell-4, piece.color);
    $('dragLayer').appendChild(canvas);
    dragging = { slotIndex: idx, piece: piece, canvas: canvas,
      offsetX: w/2, offsetY: h/2 + DRAG_LIFT, w: w, h: h, hover: null };
    document.querySelector('.pieceSlot[data-i="'+idx+'"]').classList.add('used');
    updateDragPosition(cx, cy);
    needsRedraw = true;
  }
  function updateDragPosition(cx, cy) {
    const d = dragging; if (!d) return;
    const x = cx - d.offsetX, y = cy - d.offsetY;
    d.canvas.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    const cell = state.cellSize;
    const col = Math.round((x - state.boardX)/cell);
    const row = Math.round((y - state.boardY)/cell);
    const cells = d.piece.shape.map(function(p) { return [col+p[0], row+p[1]]; });
    let valid = true;
    for (const g of cells) {
      const gx = g[0], gy = g[1];
      if (gx<0 || gx>=BOARD_SIZE || gy<0 || gy>=BOARD_SIZE || state.board[gy][gx]) { valid = false; break; }
    }
    const right = state.boardX + state.boardPixelSize;
    const bottom = state.boardY + state.boardPixelSize;
    const overlap = (x+d.w > state.boardX) && (x < right) && (y+d.h > state.boardY) && (y < bottom);
    d.hover = overlap ? { cells: cells, valid: valid } : null;
    needsRedraw = true;
  }
  function endDrag() {
    const d = dragging; if (!d) return;
    dragging = null; d.canvas.remove();
    if (d.hover && d.hover.valid) placePiece(d.slotIndex, d.piece, d.hover.cells);
    else document.querySelector('.pieceSlot[data-i="'+d.slotIndex+'"]').classList.remove('used');
    needsRedraw = true;
  }

  function placePiece(idx, piece, cells) {
    const now = performance.now();
    for (const c of cells) state.board[c[1]][c[0]] = { color: piece.color, placedAt: now };
    state.pieces[idx] = null;
    let gain = cells.length;

    const fullRows = [], fullCols = [];
    for (let y = 0; y < BOARD_SIZE; y++) {
      let full = true;
      for (let x = 0; x < BOARD_SIZE; x++) if (!state.board[y][x]) { full = false; break; }
      if (full) fullRows.push(y);
    }
    for (let x = 0; x < BOARD_SIZE; x++) {
      let full = true;
      for (let y = 0; y < BOARD_SIZE; y++) if (!state.board[y][x]) { full = false; break; }
      if (full) fullCols.push(x);
    }
    const totalLines = fullRows.length + fullCols.length;
    if (totalLines > 0) {
      state.combo++;
      state.totalLinesCleared += totalLines;
      const baseGain = 5 * totalLines * (totalLines + 1);
      const comboBonus = state.combo > 1 ? (state.combo-1)*20*totalLines : 0;
      gain += baseGain + comboBonus;
      Audio.clear(totalLines);
      if (state.combo >= 2) Audio.combo();

      for (const y of fullRows) for (let x = 0; x < BOARD_SIZE; x++) {
        const c = state.board[y][x]; if (c) state.flashCells.push({ x: x, y: y, color: c.color, t0: now });
      }
      for (const x of fullCols) for (let y = 0; y < BOARD_SIZE; y++) {
        const c = state.board[y][x]; if (c) state.flashCells.push({ x: x, y: y, color: c.color, t0: now });
      }
      const cellsToClear = state.flashCells.slice();
      setTimeout(function() {
        const seen = new Set();
        for (const fc of cellsToClear) {
          const k = fc.y*BOARD_SIZE + fc.x;
          if (seen.has(k)) continue;
          seen.add(k);
          const c = state.board[fc.y][fc.x];
          if (c) {
            state.board[fc.y][fc.x] = null;
            const rainbow = totalLines >= 3;
            const col = rainbow ? COLORS[Math.floor(Math.random()*COLORS.length)] : fc.color;
            spawnParticles(fc.x, fc.y, col, rainbow);
          }
        }
      }, FLASH_MS - 40);
      state.screenShake = Math.min(1.6, totalLines * 0.55);
      vibrate(totalLines >= 2 ? [12,30,12,30,12] : 18);
      showScorePop(baseGain + comboBonus, totalLines);
      if (state.combo >= 2) showCombo(state.combo);
    } else { state.combo = 0; Audio.place(); vibrate(6); }

    state.myScore += gain;
    updateScoreUI();
    if (state.mode === 'duel' && state.socket && state.socket.connected) {
      state.socket.emit('progress', { score: state.myScore });
    }
    if (state.pieces.every(function(p) { return p === null; })) { state.seqIndex++; loadPiecesFromSequence(); }
    renderTray(); needsRedraw = true;
    setTimeout(checkGameOver, 320);
  }
  function canPlaceAnywhere(piece) {
    let mx = 0, my = 0;
    for (const c of piece.shape) { if (c[0]>mx) mx=c[0]; if (c[1]>my) my=c[1]; }
    for (let oy = 0; oy <= BOARD_SIZE-1-my; oy++) for (let ox = 0; ox <= BOARD_SIZE-1-mx; ox++) {
      let ok = true;
      for (const c of piece.shape) if (state.board[oy+c[1]][ox+c[0]]) { ok = false; break; }
      if (ok) return true;
    }
    return false;
  }

  function updateParticles(dt) {
    for (let i = particles.length-1; i >= 0; i--) {

    if (state.flashCells.length) {
      const now = performance.now();
      const before = state.flashCells.length;
      state.flashCells = state.flashCells.filter(function(fc) { return now - fc.t0 < FLASH_MS; });
      if (state.flashCells.length !== before) needsRedraw = true;
    }
    const now = performance.now();
    let placing = false;
    for (let y = 0; y < BOARD_SIZE && !placing; y++) {
      for (let x = 0; x < BOARD_SIZE; x++) {
        const c = state.board[y][x];
        if (c && now - c.placedAt < PLACE_ANIM_MS) { placing = true; break; }
      }
    }
    if (needsRedraw || active || placing || dragging) { drawBoard(); needsRedraw = false; }
    requestAnimationFrame(loop);
  }

    state.userId = getUserId();
    const name = getUserName();
    state.nameManuallySet = !!name;
    const meta = loadLocalMeta();
    state.profile = {
      name: name || 'Игрок',
      rating: meta.rating || 0, bestScore: meta.bestScore || 0,
      coins: 0, skins: ['classic'], activeSkin: 'classic',
      achievements: [], titles: ['rookie'], activeTitle: 'rookie',
      backgrounds: ['default'], activeBackground: 'default',
      avatars: [0,1], activeAvatar: 0,
      duelWins: 0, duelLosses: 0, soloGames: 0,
      seasonal: { skins: [], menuTheme: 'default' }
    };
    state.activeSkin = 'classic';
    renderMenuRank();
    bindInput();
    applyI18n();
    resizeBoard();
    renderTray();
    requestAnimationFrame(loop);
    if (!navigator.onLine) $('offlineBadge').classList.add('on');
    initSocket();
    applyMenuTheme();
    registerServiceWorker();
    if (state.pendingRoomCode && state.nameManuallySet) setTimeout(tryJoinPendingRoom, 800);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
